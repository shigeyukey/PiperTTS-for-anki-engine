# Emscripten settings for the Japanese phonemizer module.
#
# The naist-jdic dictionary is embedded in the binary (~77 MB), so the initial
# memory must be larger than the static data and memory growth has to be enabled
# (loading the dictionary allocates another ~25 MB or more).

[target.wasm32-unknown-emscripten]
# emsdk ships emcc.exe on Windows (not emcc.bat, which rustc expects)
linker = "emcc.exe"
rustflags = [
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C", "link-arg=-sINITIAL_MEMORY=134217728",
    "-C", "link-arg=-sMAXIMUM_MEMORY=2147483648",
    "-C", "link-arg=-sMODULARIZE=1",
    "-C", "link-arg=-sEXPORT_NAME=createJaPhonemizer",
    "-C", "link-arg=-sEXPORTED_FUNCTIONS=['_ja_init','_ja_phonemize','_ja_kokoro_phonemes','_ja_free','_malloc','_free']",
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=['ccall','cwrap','UTF8ToString','lengthBytesUTF8','stringToUTF8']",
    "-C", "link-arg=-sENVIRONMENT=node,web,worker",
]
