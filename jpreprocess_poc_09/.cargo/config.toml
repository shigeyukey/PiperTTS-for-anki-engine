# Emscripten settings for the piper-plus Japanese phonemizer module.
#
# Dedicated module for the piper-plus engine (jpreprocess 0.9.1). The shared
# 0.15 module (ja_phonemizer) is built from dev_tools/jpreprocess_poc and is
# used by piper / kokoro; this module must not change those files or names.
#
# The naist-jdic dictionary is embedded in the binary, so the initial memory
# must be larger than the static data and memory growth has to be enabled.

[target.wasm32-unknown-emscripten]
# emsdk ships emcc.exe on Windows (not emcc.bat, which rustc expects)
linker = "emcc.exe"
rustflags = [
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C", "link-arg=-sINITIAL_MEMORY=134217728",
    "-C", "link-arg=-sMAXIMUM_MEMORY=2147483648",
    "-C", "link-arg=-sMODULARIZE=1",
    "-C", "link-arg=-sEXPORT_NAME=createPiperPlusPhonemizer",
    "-C", "link-arg=-sEXPORTED_FUNCTIONS=['_ja_init','_ja_piper_plus_phonemes','_ja_free','_malloc','_free']",
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=['ccall','cwrap','UTF8ToString','lengthBytesUTF8','stringToUTF8']",
    "-C", "link-arg=-sENVIRONMENT=node,web,worker",
]
